# =============================================================================
# RULE 3: Office Application Making Outbound Network Connection
# =============================================================================
# MITRE: T1071.001 (Application Layer Protocol: Web Protocols)
#        T1105 (Ingress Tool Transfer)
# Kill Chain Stage: Command & Control / Delivery
# Sysmon Event ID: 3 (Network Connection)
# Description: Macros reaching out to external C2 or staging servers to
#              download second-stage payloads.
# =============================================================================
title: Office Application Initiating Outbound Network Connection
id: a1b2c3d4-3333-4aaa-bbbb-000000000003
status: experimental
level: medium
description: |
    Detects Office applications making outbound network connections. Malicious
    macros commonly reach out to C2 infrastructure or staging servers to
    download second-stage payloads via HTTP/HTTPS or raw TCP.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1071/001/
    - https://attack.mitre.org/techniques/T1105/
tags:
    - attack.command_and_control
    - attack.t1071.001
    - attack.t1105
logsource:
    category: network_connection
    product: windows
    service: sysmon
detection:
    selection:
        Image|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\mspub.exe'
            - '\outlook.exe'
        Initiated: 'true'
    filter_trusted:
        DestinationIp|startswith:
            - '10.'
            - '172.16.'
            - '172.17.'
            - '172.18.'
            - '172.19.'
            - '172.20.'
            - '172.21.'
            - '172.22.'
            - '172.23.'
            - '172.24.'
            - '172.25.'
            - '172.26.'
            - '172.27.'
            - '172.28.'
            - '172.29.'
            - '172.30.'
            - '172.31.'
            - '192.168.'
            - '127.'
    filter_microsoft:
        DestinationHostname|endswith:
            - '.microsoft.com'
            - '.office.com'
            - '.office365.com'
            - '.live.com'
            - '.windows.net'
            - '.sharepoint.com'
    condition: selection and not filter_trusted and not filter_microsoft
falsepositives:
    - Office telemetry and update checks (filtered above)
    - Legitimate cloud-connected add-ins
    - SharePoint/OneDrive document sync


---


# =============================================================================
# RULE 4: Office Application Dropping Executable/Script Files to Disk
# =============================================================================
# MITRE: T1105 (Ingress Tool Transfer)
#        T1027 (Obfuscated Files or Information)
# Kill Chain Stage: Delivery / Installation
# Sysmon Event ID: 11 (FileCreate)
# Description: Macros writing PE executables, DLLs, scripts, or HTA files
#              to disk for subsequent execution.
# =============================================================================
title: Office Application Writing Executable or Script File to Disk
id: a1b2c3d4-4444-4aaa-bbbb-000000000004
status: experimental
level: high
description: |
    Detects Office applications writing executable, DLL, script, or HTA files
    to disk. Malicious macros commonly drop payloads to %TEMP%, %APPDATA%,
    or user profile directories for subsequent execution.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1105/
    - https://attack.mitre.org/techniques/T1027/
tags:
    - attack.execution
    - attack.defense_evasion
    - attack.t1105
    - attack.t1027
logsource:
    category: file_event
    product: windows
    service: sysmon
detection:
    selection_process:
        Image|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\mspub.exe'
            - '\outlook.exe'
    selection_extension:
        TargetFilename|endswith:
            - '.exe'
            - '.dll'
            - '.scr'
            - '.pif'
            - '.com'
            - '.bat'
            - '.cmd'
            - '.ps1'
            - '.psm1'
            - '.vbs'
            - '.vbe'
            - '.js'
            - '.jse'
            - '.wsf'
            - '.wsh'
            - '.hta'
            - '.cpl'
            - '.inf'
            - '.reg'
            - '.sct'
            - '.xsl'
            - '.jar'
            - '.lnk'
    condition: selection_process and selection_extension
falsepositives:
    - Office saving embedded OLE objects (rare)
    - Legitimate export-to-script functionality


