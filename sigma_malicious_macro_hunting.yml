            - 'net view'
            - 'net group'
            - 'net localgroup'
            - 'net user'
            - 'net share'
            - 'net use'
            - 'wmic useraccount'
            - 'wmic computersystem'
            - 'wmic os get'
            - 'wmic process list'
    condition: selection_parent and selection_recon
falsepositives:
    - IT admin scripts running from Office


