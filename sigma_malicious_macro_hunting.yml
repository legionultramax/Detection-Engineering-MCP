# =============================================================================
# RULE 8: Office Macro Spawning Process with Encoded/Obfuscated Commands
# =============================================================================
# MITRE: T1027 (Obfuscated Files), T1059.001 (PowerShell)
#        T1140 (Deobfuscate/Decode Files)
# Kill Chain Stage: Execution / Defense Evasion
# Description: Macros launching PowerShell or cmd with base64-encoded,
#              compressed, or otherwise obfuscated command lines.
# =============================================================================
title: Office Application Spawning Process with Encoded or Obfuscated Command Line
id: a1b2c3d4-9999-4aaa-bbbb-000000000010
status: experimental
level: critical
description: |
    Detects Office applications spawning PowerShell or cmd.exe with
    base64-encoded, compressed, hidden, or obfuscated command-line arguments.
    This is a hallmark of weaponized macro payloads attempting to evade
    static detection.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1027/
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1140/
tags:
    - attack.execution
    - attack.defense_evasion
    - attack.t1027
    - attack.t1059.001
    - attack.t1140
logsource:
    category: process_creation
    product: windows
    service: sysmon
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\mspub.exe'
            - '\outlook.exe'
    selection_encoded:
        CommandLine|contains:
            - '-enc '
            - '-EncodedCommand'
            - '-e JAB'
            - '-e SQBF'
            - '-e SQBu'
            - '-e SUVYA'
            - '-WindowStyle Hidden'
            - '-w hidden'
            - '-w 1'
            - '-nop'
            - '-noni'
            - '-NoProfile'
            - '-NonInteractive'
            - '-ExecutionPolicy Bypass'
            - '-ep bypass'
            - '-exec bypass'
            - 'FromBase64String'
            - '[Convert]::'
            - 'IO.Compression'
            - 'IO.MemoryStream'
            - 'Invoke-Expression'
            - 'IEX('
            - 'IEX ('
            - 'iex('
            - 'iex ('
            - '.DownloadString('
            - '.DownloadFile('
            - '.DownloadData('
            - 'Net.WebClient'
            - 'Net.WebRequest'
            - 'Start-BitsTransfer'
            - 'Invoke-WebRequest'
            - 'Invoke-RestMethod'
            - 'cmd /c echo'
            - 'cmd.exe /c echo'
            - '^^'
            - '%COMSPEC%'
            - 'cmd /V'
            - 'set /p='
    condition: selection_parent and selection_encoded
falsepositives:
    - Rare legitimate admin scripts with encoded parameters


---


# =============================================================================
# RULE 9: Macro Execution Chain Leading to Credential Access (LSASS)
# =============================================================================
# MITRE: T1003.001 (LSASS Memory)
# Kill Chain Stage: Credential Access
# Sysmon Event ID: 10 (ProcessAccess)
# Description: A macro-spawned process (or its grandchild) accesses LSASS
#              memory to dump credentials — the holy grail for attackers.
# =============================================================================
title: Office Macro Chain Accessing LSASS for Credential Dumping
id: a1b2c3d4-aaaa-4aaa-bbbb-000000000011
status: experimental
level: critical
description: |
    Detects processes with Office applications in their parent chain
    accessing lsass.exe with rights consistent with credential dumping
    (Mimikatz-style). Indicates a full compromise chain from macro to
    credential theft.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1003/001/
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
    service: sysmon
detection:
    selection_target:
        TargetImage|endswith: '\lsass.exe'
    selection_source:
        SourceImage|endswith:
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\certutil.exe'
    selection_access_rights:
        GrantedAccess|contains:
            - '0x1010'
            - '0x1410'
            - '0x1F0FFF'
            - '0x1F1FFF'
            - '0x1F3FFF'
            - '0x1FFFFF'
    selection_parent_chain:
        SourceParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\outlook.exe'
    condition: selection_target and selection_source and selection_access_rights and selection_parent_chain
falsepositives:
    - Antivirus scanning LSASS (usually has different access rights)
    - Windows Defender Credential Guard queries


---


# =============================================================================
# RULE 10: Office Application Creating WMI Event Subscription (Persistence)
# =============================================================================
# MITRE: T1546.003 (WMI Event Subscription)
# Kill Chain Stage: Persistence
# Sysmon Event ID: 19, 20, 21 (WMI Events)
# Description: Macros using WMI event subscriptions to maintain persistent
#              code execution across reboots.
# =============================================================================
title: WMI Event Subscription Created After Office Macro Execution
id: a1b2c3d4-bbbb-4aaa-bbbb-000000000012
status: experimental
level: critical
description: |
    Detects WMI event consumer/filter/binding creation where the process
    chain originates from an Office application. Malicious macros use WMI
    event subscriptions as a stealthy persistence mechanism.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1546/003/
tags:
    - attack.persistence
    - attack.t1546.003
logsource:
    category: wmi_event
    product: windows
    service: sysmon
detection:
    selection:
        EventType:
            - 'WmiConsumerEvent'
            - 'WmiBindingEvent'
            - 'WmiFilterEvent'
        User|contains:
            - 'SYSTEM'
            - 'NT AUTHORITY'
    condition: selection
falsepositives:
