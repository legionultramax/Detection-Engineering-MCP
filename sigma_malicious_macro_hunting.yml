# =============================================================================
# RULE 12: Office Application Spawning Process that Writes to Startup Folder
# =============================================================================
# MITRE: T1547.001 (Registry Run Keys / Startup Folder)
# Kill Chain Stage: Persistence
# Sysmon Event ID: 11 (FileCreate)
# Description: Macros dropping files into Startup folders for persistence.
# =============================================================================
title: Office Application Writing Files to Startup Folder
id: a1b2c3d4-dddd-4aaa-bbbb-000000000014
status: experimental
level: critical
description: |
    Detects Office applications writing files to user or system Startup
    folders. Malicious macros use this as a simple persistence mechanism
    to execute payloads on next login.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1547/001/
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: file_event
    product: windows
    service: sysmon
detection:
    selection_process:
        Image|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\mspub.exe'
            - '\outlook.exe'
    selection_startup:
        TargetFilename|contains:
            - '\Start Menu\Programs\Startup\'
            - '\Microsoft\Windows\Start Menu\Programs\Startup\'
    condition: selection_process and selection_startup
falsepositives:
    - Legitimate Office installer post-setup scripts (extremely rare)


