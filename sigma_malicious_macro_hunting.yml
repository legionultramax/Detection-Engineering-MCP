# =============================================================================
# RULE 14: Office Macro Disabling Security Settings via Registry
# =============================================================================
# MITRE: T1562.001 (Disable or Modify Tools)
# Kill Chain Stage: Defense Evasion
# Sysmon Event ID: 13 (RegistryValueSet)
# Description: Macros disabling macro security, Protected View, AMSI,
#              or other security controls to enable future attacks.
# =============================================================================
title: Office Macro Disabling Security Controls via Registry Modification
id: a1b2c3d4-ffff-4aaa-bbbb-000000000016
status: experimental
level: critical
description: |
    Detects Office applications or their child processes modifying registry
    keys that control Office security settings — disabling Protected View,
    macro warnings, AMSI integration, or VBA security. This enables
    future malicious documents to execute without user interaction.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1562/001/
tags:
    - attack.defense_evasion
    - attack.t1562.001
logsource:
    category: registry_set
    product: windows
    service: sysmon
detection:
    selection_process:
        Image|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\reg.exe'
            - '\powershell.exe'
            - '\cmd.exe'
    selection_security_keys:
        TargetObject|contains:
            - '\Security\VBAWarnings'
            - '\Security\DisableInternetFilesInPV'
            - '\Security\DisableUnsafeLocationsInPV'
            - '\Security\DisableAttachementsInPV'
            - '\Security\ProtectedView\DisableInternetFilesInPV'
            - '\Security\ProtectedView\DisableUnsafeLocationsInPV'
            - '\Security\ProtectedView\DisableAttachementsInPV'
            - '\Security\AccessVBOM'
            - '\Security\BlockContentExecutionFromInternet'
            - '\Common\Security\DisableMacroNotifications'
    selection_disable_value:
        Details|contains:
            - 'DWORD (0x00000001)'
            - 'DWORD (0x00000000)'
    condition: selection_process and selection_security_keys
falsepositives:
    - Group Policy deployments modifying Office security (from svchost/GPO)
    - IT admin intentionally enabling macros for trusted workflows


