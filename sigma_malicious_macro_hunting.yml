            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\outlook.exe'
    selection_recon:
        - Image|endswith:
            - '\whoami.exe'
            - '\hostname.exe'
            - '\systeminfo.exe'
            - '\ipconfig.exe'
            - '\net.exe'
            - '\net1.exe'
            - '\nltest.exe'
            - '\dsquery.exe'
