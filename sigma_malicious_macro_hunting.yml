# =============================================================================
# RULE 5: Office Macro Child Process Performing Process Injection
# =============================================================================
# MITRE: T1055.001 (DLL Injection), T1055.012 (Process Hollowing)
# Kill Chain Stage: Defense Evasion / Privilege Escalation
# Sysmon Event ID: 8 (CreateRemoteThread), 10 (ProcessAccess)
# Description: After macro execution, the spawned process injects code into
#              another process to evade detection and gain elevated context.
# =============================================================================
title: Process Injection from Office Macro Child Process (CreateRemoteThread)
id: a1b2c3d4-5555-4aaa-bbbb-000000000005
status: experimental
level: critical
description: |
    Detects CreateRemoteThread events where the source process is a child of
    an Office application. This indicates a macro-spawned process is injecting
    code into another process (process hollowing, DLL injection, etc.).
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1055/
    - https://attack.mitre.org/techniques/T1055/012/
tags:
    - attack.defense_evasion
    - attack.privilege_escalation
    - attack.t1055
    - attack.t1055.001
    - attack.t1055.012
logsource:
    category: create_remote_thread
    product: windows
    service: sysmon
detection:
    selection:
        SourceImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\mspub.exe'
            - '\outlook.exe'
    filter_legitimate:
        TargetImage|endswith:
            - '\splwow64.exe'
    condition: selection and not filter_legitimate
falsepositives:
    - Print spooler interaction (filtered)
    - Rare legitimate Office COM interactions

---

title: Suspicious Process Access from Office Application (LSASS/Explorer)
id: a1b2c3d4-5556-4aaa-bbbb-000000000006
status: experimental
level: critical
description: |
    Detects an Office application or its direct child process accessing
    sensitive processes such as LSASS or explorer.exe with suspicious access
    rights, indicating process injection or credential dumping.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1055/
tags:
    - attack.defense_evasion
    - attack.credential_access
    - attack.t1055
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
    service: sysmon
detection:
    selection_source:
        SourceImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
    selection_target:
        TargetImage|endswith:
            - '\lsass.exe'
            - '\explorer.exe'
            - '\svchost.exe'
            - '\csrss.exe'
    selection_access:
        GrantedAccess|contains:
            - '0x1F0FFF'  # PROCESS_ALL_ACCESS
            - '0x1010'    # PROCESS_VM_READ | PROCESS_QUERY_INFORMATION
            - '0x1FFFFF'
            - '0x0800'    # PROCESS_SUSPEND_RESUME
            - '0x0040'    # PROCESS_DUP_HANDLE
    condition: selection_source and selection_target and selection_access
falsepositives:
    - Antivirus hooking into Office processes


---


# =============================================================================
# RULE 6: Office Application Loading Suspicious DLLs
# =============================================================================
# MITRE: T1055.001 (DLL Injection), T1129 (Shared Modules)
# Kill Chain Stage: Execution / Defense Evasion
# Sysmon Event ID: 7 (Image Loaded)
# Description: Macros can load malicious DLLs from unusual paths using
#              VBA's Declare statements or COM object abuse.
# =============================================================================
title: Office Application Loading DLL from Suspicious Location
id: a1b2c3d4-7777-4aaa-bbbb-000000000007
status: experimental
level: high
description: |
    Detects Office applications loading DLLs from unusual or user-writable
    directories such as %TEMP%, %APPDATA%, Downloads, Desktop, or Public
    folders. Malicious macros use VBA Declare/DLL side-loading to execute
    arbitrary code.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1129/
    - https://attack.mitre.org/techniques/T1055/001/
tags:
    - attack.execution
    - attack.defense_evasion
    - attack.t1129
    - attack.t1055.001
logsource:
    category: image_load
    product: windows
    service: sysmon
detection:
    selection_process:
        Image|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\mspub.exe'
    selection_dll_path:
        ImageLoaded|contains:
            - '\Temp\'
            - '\AppData\Local\Temp\'
            - '\AppData\Roaming\'
            - '\Downloads\'
            - '\Desktop\'
            - '\Documents\'
            - '\Public\'
            - '\ProgramData\'
            - '\Users\Public\'
    selection_dll_ext:
        ImageLoaded|endswith:
            - '.dll'
            - '.ocx'
    condition: selection_process and selection_dll_path and selection_dll_ext
falsepositives:
    - Legitimate Office add-ins installed in user profile
    - Some COM add-ins in AppData


---


# =============================================================================
# RULE 7: Office Macro Creating Scheduled Task or Registry Persistence
# =============================================================================
# MITRE: T1053.005 (Scheduled Task), T1547.001 (Registry Run Keys)
# Kill Chain Stage: Persistence
# Sysmon Event ID: 1 (Process Creation), 12/13 (Registry)
# Description: Macros establishing persistence by creating scheduled tasks
#              or modifying registry Run/RunOnce keys.
# =============================================================================
title: Office Application Creating Scheduled Task for Persistence
id: a1b2c3d4-8888-4aaa-bbbb-000000000008
status: experimental
level: critical
description: |
    Detects Office applications or their child processes creating scheduled
    tasks. Malicious macros use schtasks.exe or COM objects to establish
    persistence on the compromised host.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1053/005/
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
    service: sysmon
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\mspub.exe'
            - '\outlook.exe'
    selection_schtasks:
        Image|endswith:
            - '\schtasks.exe'
            - '\at.exe'
