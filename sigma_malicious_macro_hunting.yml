id: a1b2c3d4-cccc-4aaa-bbbb-000000000013
status: experimental
level: high
description: |
    Detects Office applications spawning processes that perform host or
    network reconnaissance. Malicious macros commonly enumerate the
    compromised environment before lateral movement.
