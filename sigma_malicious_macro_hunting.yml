# =============================================================================
# RULE 13: Office Application Creating Pipes (Named Pipe for C2)
# =============================================================================
# MITRE: T1570 (Lateral Tool Transfer), T1071 (Application Layer Protocol)
# Kill Chain Stage: Command & Control
# Sysmon Event ID: 17/18 (Pipe Created/Connected)
# Description: Macros creating named pipes for inter-process communication
#              commonly used by C2 frameworks (Cobalt Strike, Metasploit).
# =============================================================================
title: Suspicious Named Pipe Created by Office Application
id: a1b2c3d4-eeee-4aaa-bbbb-000000000015
status: experimental
level: high
description: |
    Detects Office applications creating named pipes. Malicious macros can
    create named pipes for C2 communication (e.g., Cobalt Strike SMB beacon),
    inter-process data transfer, or lateral movement staging.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1071/
tags:
    - attack.command_and_control
    - attack.execution
    - attack.t1071
logsource:
    category: pipe_created
    product: windows
    service: sysmon
detection:
    selection:
        Image|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\outlook.exe'
    filter_legitimate:
        PipeName|startswith:
            - '\MSOLAP$'
            - '\Winsock'
    condition: selection and not filter_legitimate
falsepositives:
