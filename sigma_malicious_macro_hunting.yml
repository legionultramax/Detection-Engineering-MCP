id: a1b2c3d4-2222-4aaa-bbbb-000000000002
status: experimental
level: high
description: |
    Detects Office applications spawning LOLBAS binaries commonly abused by
    malicious macros to download payloads, proxy execution, or evade defenses.
    Includes certutil, regsvr32, rundll32, wmic, bitsadmin, msiexec, etc.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://lolbas-project.github.io/
    - https://attack.mitre.org/techniques/T1218/
tags:
    - attack.execution
    - attack.defense_evasion
    - attack.t1218.005
    - attack.t1218.010
    - attack.t1218.011
    - attack.t1047
    - attack.t1105
logsource:
    category: process_creation
    product: windows
    service: sysmon
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\mspub.exe'
            - '\outlook.exe'
    selection_lolbas:
        Image|endswith:
            - '\certutil.exe'
            - '\regsvr32.exe'
            - '\rundll32.exe'
            - '\wmic.exe'
            - '\bitsadmin.exe'
            - '\msiexec.exe'
            - '\installutil.exe'
            - '\msdt.exe'
            - '\hh.exe'
            - '\control.exe'
            - '\pcalua.exe'
            - '\forfiles.exe'
            - '\schtasks.exe'
            - '\at.exe'
            - '\cmstp.exe'
            - '\xwizard.exe'
            - '\desktopimgdownldr.exe'
            - '\replace.exe'
            - '\msconfig.exe'
    condition: selection_parent and selection_lolbas
falsepositives:
    - Legitimate software installers triggered from Office
    - Rare IT deployment scripts


