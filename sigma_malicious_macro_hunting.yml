# =============================================================================
# RULE 15: Office Application Spawning Process with Alternate Data Stream
# =============================================================================
# MITRE: T1564.004 (NTFS File Attributes / ADS)
# Kill Chain Stage: Defense Evasion
# Sysmon Event ID: 15 (FileCreateStreamHash)
# Description: Macros hiding payloads in NTFS Alternate Data Streams.
# =============================================================================
title: Office Application Creating Alternate Data Stream
id: a1b2c3d4-1234-4aaa-bbbb-000000000017
status: experimental
level: high
description: |
    Detects Office applications creating Alternate Data Streams (ADS).
    Malicious macros can hide payloads in ADS to evade file-based detection
    and persist covertly on disk.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1564/004/
tags:
    - attack.defense_evasion
    - attack.t1564.004
logsource:
    category: create_stream_hash
    product: windows
    service: sysmon
detection:
    selection:
        Image|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\outlook.exe'
    filter_legitimate:
        TargetFilename|endswith:
            - ':Zone.Identifier'
    condition: selection and not filter_legitimate
falsepositives:
    - Zone.Identifier ADS creation (filtered)
    - Rare Office temporary stream operations
