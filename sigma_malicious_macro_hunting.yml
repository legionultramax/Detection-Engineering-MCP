# =============================================================================
# THREAT HUNTING: Malicious Macro Execution — Full Kill Chain
# Data Source: Sysmon
# Author: Threat Hunting Team
# Created: 2026-02-14
# Description: Comprehensive Sigma rules covering all exploitation paths
#              when a malicious Office macro is executed.
# =============================================================================


# =============================================================================
# RULE 1: Office Application Spawning Suspicious Child Processes
# =============================================================================
# MITRE: T1204.002 (User Execution: Malicious File)
#        T1059.001 (PowerShell), T1059.003 (Windows Command Shell)
#        T1059.005 (Visual Basic)
# Kill Chain Stage: Execution
# Description: Detects Office apps (Word, Excel, PowerPoint, etc.) spawning
#              shell interpreters or scripting engines — the most common
#              first-stage behavior of a weaponized macro.
# =============================================================================
title: Office Application Spawning Suspicious Child Process
id: a1b2c3d4-1111-4aaa-bbbb-000000000001
status: experimental
level: high
description: |
    Detects Microsoft Office applications spawning command-line interpreters,
    scripting engines, or other suspicious child processes. This is the primary
    indicator of malicious macro execution.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1204/002/
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1059/003/
tags:
    - attack.execution
    - attack.t1204.002
    - attack.t1059.001
    - attack.t1059.003
    - attack.t1059.005
logsource:
    category: process_creation
    product: windows
    service: sysmon
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\mspub.exe'
            - '\visio.exe'
            - '\outlook.exe'
            - '\onenote.exe'
            - '\eqnedt32.exe'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\bash.exe'
            - '\sh.exe'
            - '\scriptrunner.exe'
            - '\conhost.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Legitimate Office add-ins that invoke command-line tools
    - IT admin scripts triggered from Office
    - Some CRM/ERP plugins for Excel


---


# =============================================================================
# RULE 2: Office Application Spawning LOLBAS Binaries
# =============================================================================
# MITRE: T1218.005 (Mshta), T1218.010 (Regsvr32), T1218.011 (Rundll32)
#        T1047 (WMI), T1105 (Ingress Tool Transfer), T1140 (Deobfuscate)
# Kill Chain Stage: Execution / Defense Evasion
# Description: Macros frequently abuse Living Off The Land Binaries to
