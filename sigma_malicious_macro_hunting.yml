title: Office Application Modifying Registry Run Keys for Persistence
id: a1b2c3d4-8889-4aaa-bbbb-000000000009
status: experimental
level: critical
description: |
    Detects Office applications modifying registry Run/RunOnce keys.
    Malicious macros write entries to auto-start keys to persist across
    reboots.
author: Threat Hunting Team
date: 2026/02/14
references:
    - https://attack.mitre.org/techniques/T1547/001/
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
    service: sysmon
detection:
    selection_process:
        Image|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\msaccess.exe'
            - '\mspub.exe'
            - '\outlook.exe'
    selection_registry:
        TargetObject|contains:
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\'
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce\'
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\RunServices\'
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run\'
            - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\Shell'
            - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\Userinit'
            - '\Environment\UserInitMprLogonScript'
            - '\SOFTWARE\Microsoft\Office\*\Word\Security\AccessVBOM'
            - '\SOFTWARE\Microsoft\Office\*\Excel\Security\AccessVBOM'
    condition: selection_process and selection_registry
falsepositives:
    - Office Trust Center configuration changes by administrators


