title: Impacket Wmiexec.py WMI Command Execution Pattern
id: a7b8c9d0-1047-4fb0-d132-wmiexec006aa
status: experimental
description: >
  Detects Impacket's wmiexec.py execution on the target host. Wmiexec uses WMI to spawn
  cmd.exe /Q /c via wmiprvse.exe, with output redirected to \\127.0.0.1\ADMIN$\__ followed
  by a full UNIX epoch timestamp (e.g., __1713200400.1234567). The wmiprvse.exe parent +
  cmd.exe /Q /c + \\127.0.0.1\ADMIN$ combination is the highest-fidelity detection anchor.
  This is distinct from dcomexec which uses mmc.exe parent and 5-digit epoch suffix.
  Maps to T1047 Windows Management Instrumentation.
references:
  - https://attack.mitre.org/techniques/T1047/
  - https://github.com/fortra/impacket/blob/master/impacket/examples/wmiexec.py
  - https://www.youtube.com/watch?v=13cubed
  - https://threathunt.blog/impacket-part-1/
author: Detection Engineering (Harris HawkEye)
date: 2026-04-15
modified: 2026-04-15
tags:
  - attack.execution
  - attack.t1047
  - attack.lateral-movement
  - tool.impacket
  - tool.impacket.wmiexec
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\wmiprvse.exe'
  selection_cmd:
    Image|endswith: '\cmd.exe'
  selection_pattern:
    CommandLine|contains|all:
      - '/Q'
      - '/c'
      - '\\127.0.0.1\'
      - 'ADMIN$'
      - '2>&1'
  condition: selection_parent and selection_cmd and selection_pattern
falsepositives:
  - No known legitimate software uses wmiprvse.exe to spawn cmd.exe with loopback ADMIN$ share redirect
level: critical
