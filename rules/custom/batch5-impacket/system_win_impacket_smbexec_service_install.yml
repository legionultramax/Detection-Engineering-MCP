title: Impacket Smbexec.py Service Installation Pattern
id: d4e5f6a7-1021-4c8d-ae0f-smbexecsvc3dd
status: experimental
description: >
  Detects service installation patterns characteristic of Impacket's smbexec.py on the target host.
  Smbexec creates a service for EVERY command, with ImagePath containing execute.bat and __output
  redirect patterns. Pre-May 2023, the default service name was BTOBTO; post-May 2023, it uses a
  random 8-character mixed-case alpha string. This rule covers both variants via the invariant
  ImagePath pattern. Maps to T1021.002 SMB/Windows Admin Shares + T1569.002 Service Execution.
references:
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1569/002/
  - https://github.com/fortra/impacket/blob/master/impacket/examples/smbexec.py
  - https://www.youtube.com/watch?v=13cubed
author: Detection Engineering (Harris HawkEye)
date: 2026-04-15
modified: 2026-04-15
tags:
  - attack.lateral-movement
  - attack.t1021.002
  - attack.execution
  - attack.t1569.002
  - tool.impacket
  - tool.impacket.smbexec
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_legacy_name:
    ServiceName: 'BTOBTO'
  selection_imagepath_pattern:
    ImagePath|contains|all:
      - 'execute.bat'
      - '__output'
  selection_imagepath_comspec:
    ImagePath|contains|all:
      - '%COMSPEC%'
      - '/Q'
      - '/c'
      - 'execute.bat'
  condition: selection_eid and (selection_legacy_name or selection_imagepath_pattern or selection_imagepath_comspec)
falsepositives:
  - Custom deployment scripts named execute.bat that also use __output as output file — extremely unlikely combination
level: critical
